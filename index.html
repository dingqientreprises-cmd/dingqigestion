<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion Boutique Outillage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Plan : barre latérale d'atelier (acier sombre) + zone de travail claire ; accent orange sécurité ; tableaux denses, chiffres alignés. */
:root{
  --bg:#f1f3f5; --panel:#ffffff; --ink:#1b2530; --muted:#5d6b79; --line:#d9dee4;
  --steel:#22303d; --steel-ink:#e6ebf0; --steel-muted:#93a1ae;
  --accent:#d9480f; --accent-ink:#ffffff; --accent-soft:#fdebe2;
  --ok:#1f7a45; --ok-bg:#e1f3e8; --warn:#96610a; --warn-bg:#fbf0d3; --crit:#b3261e; --crit-bg:#fbe4e2;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#12181e; --panel:#1b232c; --ink:#e7ecf1; --muted:#98a5b2; --line:#2e3a46;
  --steel:#0c1116; --steel-ink:#e6ebf0; --steel-muted:#8696a5;
  --accent:#ff7a3d; --accent-ink:#1a0d05; --accent-soft:#3a2216;
  --ok:#6fd195; --ok-bg:#173524; --warn:#f0c35a; --warn-bg:#3a2e12; --crit:#ff8d85; --crit-bg:#431c19;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12181e; --panel:#1b232c; --ink:#e7ecf1; --muted:#98a5b2; --line:#2e3a46;
  --steel:#0c1116; --steel-ink:#e6ebf0; --steel-muted:#8696a5;
  --accent:#ff7a3d; --accent-ink:#1a0d05; --accent-soft:#3a2216;
  --ok:#6fd195; --ok-bg:#173524; --warn:#f0c35a; --warn-bg:#3a2e12; --crit:#ff8d85; --crit-bg:#431c19;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);display:flex;min-height:100vh}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px} h2{font-size:21px} h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Barre latérale */
#side{background:var(--steel);color:var(--steel-ink);width:228px;flex:none;padding:18px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
#brand{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;padding:0 8px;overflow-wrap:anywhere}
#brand small{display:block;font:500 12px var(--body);color:var(--steel-muted);margin-top:3px}
nav{display:flex;flex-direction:column;gap:2px}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--steel-muted);padding:10px 8px 3px}
nav a{color:var(--steel-ink);text-decoration:none;padding:7px 10px;border-radius:6px;border-left:3px solid transparent;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
nav a:hover{background:rgba(255,255,255,.07)}
nav a.on{background:rgba(255,255,255,.1);border-left-color:var(--accent);font-weight:600}
nav a b{background:var(--accent);color:var(--accent-ink);border-radius:9px;font-size:11px;padding:1px 7px;align-self:center}
#status{margin-top:auto;font-size:12px;color:var(--steel-muted);padding:8px;border-top:1px solid rgba(255,255,255,.12)}
#status i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#8696a5;margin-right:6px}
#status.ok i{background:#4cc27e} #status.local i,#status.late i{background:#f0c35a} #status.err i{background:#ff6b61}

main{flex:1;min-width:0;padding:22px clamp(16px,3vw,34px) 60px;display:flex;flex-direction:column;gap:16px}
#bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#bar h1{margin-right:auto}
#bar input[type=search]{width:min(260px,100%)}
.sub{color:var(--muted);font-size:13.5px}

input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:74px;resize:vertical}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:13px;font-weight:500}
.btn.danger{color:var(--crit)}
.btn.ghost{border-style:dashed}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.panel>header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel .pad{padding:14px 16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.r{text-align:right} th.r{text-align:right}
td.act{text-align:right;white-space:nowrap}
td.act .btn{margin-left:4px}
.pill{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 16px;border-top:3px solid var(--steel)}
.tile.hot{border-top-color:var(--accent)}
.tile span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile strong{display:block;font:700 27px/1.15 var(--display);font-variant-numeric:tabular-nums;margin-top:3px;overflow-wrap:anywhere}
.tile em{font-style:normal;font-size:13px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding:14px 16px 8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bars u{display:block;width:100%;max-width:44px;background:var(--steel-muted);border-radius:3px 3px 0 0;min-height:2px;text-decoration:none}
.bars div:last-child u{background:var(--accent)}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}
dl.info{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0}
dl.info dt{color:var(--muted)} dl.info dd{margin:0;overflow-wrap:anywhere}

/* Fenêtres */
.ovl{position:fixed;inset:0;background:rgba(10,15,20,.55);display:none;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow-y:auto;z-index:10}
.ovl.open{display:flex}
.dlg{background:var(--panel);border-radius:10px;width:min(560px,100%);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.3)}
.dlg.wide{width:min(900px,100%)}
.dlg>header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg .body{padding:16px 18px;display:grid;gap:14px}
.dlg>footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fld{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.fld.full{grid-column:1/-1}
.fld>*:not(span){font-size:15px;color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center}
.chk input{width:auto}
#ed-lines td{padding:5px 6px;border:0}
#ed-lines th{padding:5px 6px}
#ed-lines td:first-child{min-width:190px}
#ed-lines input{text-align:right;min-width:74px}
.tot{margin-left:auto;display:grid;grid-template-columns:auto auto;gap:3px 22px;font-variant-numeric:tabular-nums;justify-content:end}
.tot b{font:700 20px var(--display)}
.tot span:nth-child(even),.tot b:nth-child(even){text-align:right}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--steel);color:var(--steel-ink);padding:10px 16px;border-radius:8px;z-index:30;display:none;max-width:90vw;border-left:4px solid var(--ok)}
#toast.bad{border-left-color:var(--crit)}

/* Aperçu de document : toujours papier blanc */
.paper{background:#fff;color:#16202a;border:1px solid #cfd6dd;border-radius:4px;padding:26px;font-size:14px;overflow-x:auto}
.paper .top{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;border-bottom:2px solid #22303d;padding-bottom:12px;margin-bottom:14px}
.paper .top h2{font-size:24px;color:#16202a}
.paper .top .t{text-align:right}
.paper .top .t h2{color:#d9480f}
.paper table{margin:12px 0}
.paper th{color:#4b5967;border-bottom:1px solid #22303d;background:#eef1f4}
.paper td{border-bottom:1px solid #dfe4e9}
.paper .ptot{margin-left:auto;width:max-content;display:grid;grid-template-columns:auto auto;gap:3px 26px;font-variant-numeric:tabular-nums}
.paper .ptot .b{font-weight:700;font-size:16px}
.paper .ptot span:nth-child(even){text-align:right}
.paper p{margin:8px 0;max-width:75ch}
.paper h4{margin:14px 0 2px;font:700 15px var(--body)}
.paper .sig{display:flex;justify-content:space-between;gap:20px;margin-top:38px;padding-bottom:46px;font-weight:600}
.paper .foot{text-align:center;color:#5d6b79;font-size:12.5px;margin-top:10px}

/* Couleurs : tableau de bord, barre latérale et barre du haut */
:root{--head:#e4eefa;--k1:#d9480f;--k2:#1864ab;--k3:#c2255c;--k4:#2b8a3e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--head:#1b2c40}}
:root[data-theme="dark"]{--head:#1b2c40}
#side{background:linear-gradient(180deg,#14467a 0%,#0e2a4d 60%,#0a1d36 100%)}
#brand{color:#fff;border-bottom:3px solid #ff7a3d;padding-bottom:10px}
nav .grp{color:#ffb489}
nav a.on{background:#ff7a3d;color:#1a0d05;border-left-color:#fff}
nav a.on b{background:#1a0d05;color:#fff}
#bar{background:linear-gradient(90deg,#1864ab,#14467a);color:#fff;padding:12px 16px;border-radius:8px}
#bar input{color:var(--ink)}
.panel>header{background:var(--head);border-radius:8px 8px 0 0;border-left:4px solid var(--k2)}
th{background:var(--head)}
.tile,.tile.hot{border:0;color:#fff}
.tile span,.tile em{color:rgba(255,255,255,.88)}
.tile:nth-child(1){background:var(--k1)}.tile:nth-child(2){background:var(--k2)}.tile:nth-child(3){background:var(--k3)}.tile:nth-child(4){background:var(--k4)}
.bars u{background:var(--k2)}
.bars div:nth-child(3n+2) u{background:var(--k4)}.bars div:nth-child(3n) u{background:#e8a80c}
.bars div:last-child u{background:var(--k1)}
nav a{border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 38%,transparent)}
nav a:hover{background:color-mix(in srgb,var(--c) 60%,transparent)}
nav a.on{background:var(--c);color:#fff;border-left-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
nav a.on b{background:#fff;color:#1a0d05}
#blogo{display:block;max-width:100%;max-height:84px;background:#fff;border-radius:8px;padding:6px;margin-bottom:10px}
.paper .top img{display:block;max-height:72px;max-width:200px;margin-bottom:6px}
.logobox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logobox img{max-height:90px;max-width:200px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px}
.logobox input{width:auto;max-width:100%}
@media (max-width:820px){
  body{flex-direction:column}
  #side{width:auto;height:auto;position:static;padding:12px 12px 8px;gap:8px}
  nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px}
  nav .grp{display:none}
  nav a{border-left:0;border-bottom:3px solid transparent}
  nav a{border-bottom-color:var(--c)}nav a.on{border-bottom-color:#fff}nav{padding:3px 3px 8px}
  #status{margin:0;border:0;padding:0 8px}
  td.act{white-space:normal}
}
@media (prefers-reduced-motion:no-preference){.btn{transition:filter .12s,border-color .12s}}
</style>
</head>
<body>
<aside id="side">
  <div id="brand"><img id="blogo" alt="" hidden><span id="bname">Boutique Outillage</span><small>Gestion</small></div>
  <nav id="nav"></nav>
  <div id="status"><i></i><span>Connexion…</span></div>
</aside>
<main>
  <div id="bar"></div>
  <div id="content"></div>
</main>
<div class="ovl" id="modal"><form class="dlg" id="mform" novalidate></form></div>
<div class="ovl" id="confirm" style="z-index:20"><div class="dlg"><div class="body" id="cmsg"></div><footer><button type="button" class="btn" id="cno">Annuler</button><button type="button" class="btn pri" id="cyes">Confirmer</button></footer></div></div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
/* ---------- Outils ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=Number(v);return isFinite(n)?n:0};
const grp=n=>String(Math.round(num(n))).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const money=n=>grp(n)+' '+cfg().devise;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdate=s=>s?s.split('-').reverse().join('/'):'';
const strip=o=>{const c={...o};delete c.id;return c};
const byId=(col,id)=>state[col].find(x=>x.id===id);

/* Montant en lettres (français) */
const U=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'];
const T=['','dix','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
function s100(n){if(n<17)return U[n];if(n<20)return 'dix-'+U[n-10];const d=Math.floor(n/10),u=n%10;
  if(d===7||d===9){if(d===7&&u===1)return 'soixante et onze';return T[d]+'-'+s100(10+u)}
  if(u===0)return d===8?'quatre-vingts':T[d];if(u===1&&d!==8)return T[d]+' et un';return T[d]+'-'+U[u]}
function s1000(n){const c=Math.floor(n/100),r=n%100;const s=c===0?'':c===1?'cent':U[c]+' cent'+(r===0?'s':'');return (s+(r?' '+s100(r):'')).trim()}
function lettres(n){n=Math.round(Math.abs(num(n)));if(n===0)return 'zéro';const p=[];
  const md=Math.floor(n/1e9),mi=Math.floor(n%1e9/1e6),k=Math.floor(n%1e6/1e3),r=n%1e3;
  if(md)p.push(s1000(md)+' milliard'+(md>1?'s':''));if(mi)p.push(s1000(mi)+' million'+(mi>1?'s':''));
  if(k)p.push(k===1?'mille':s1000(k).replace(/(cent|vingt)s$/,'$1')+' mille');if(r)p.push(s1000(r));return p.join(' ')}

/* ---------- Données ---------- */
const COLS=['produits','clients','fournisseurs','employes','depenses','factures','recus','commandes','livraisons','contrats','config'];
const state={};COLS.forEach(c=>state[c]=[]);
const S={db:null,dl:null,ready:false,view:'tableau',q:''};
const LSKEY='boutique-outillage-v1';
function cfg(){return Object.assign({nom:'Ma Boutique Outillage',adresse:'',ville:'',tel:'',email:'',rccm:'',devise:'GNF',deviseNom:'francs guinéens',pied:'Merci de votre confiance.'},state.config.find(c=>c.id==='boutique')||{})}
const logo=()=>{const l=state.config.find(c=>c.id==='logo');return l&&l.data?l:null};
const store={
  async save(col,id,data){
    if(!S.ready)throw {message:'les données sont encore en cours de chargement'};
    data=strip(data);
    if(S.db){const ref=id?S.db.collection(col).doc(id):S.db.collection(col).doc();await ref.set(data);return ref.id}
    id=id||Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    const i=state[col].findIndex(x=>x.id===id);const row={id,...data};
    if(i>=0)state[col][i]=row;else state[col].push(row);saveLocal();refresh();return id},
  async remove(col,id){
    if(S.db){await S.db.collection(col).doc(id).delete();return}
    state[col]=state[col].filter(x=>x.id!==id);saveLocal();refresh()}
};
function saveLocal(){try{localStorage.setItem(LSKEY,JSON.stringify(state))}catch(e){}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LSKEY)||'{}');COLS.forEach(c=>{if(Array.isArray(d[c]))state[c]=d[c]})}catch(e){}}
function setStatus(k){const m={wait:'Connexion…',ok:'Données enregistrées en ligne',local:'Enregistré sur cet appareil seulement',late:'Données non joignables pour l\'instant',err:'Accès aux données interrompu'};
  const el=$('#status');el.className=k;$('span',el).textContent=m[k]}
function nextNum(col,pre){const m=state[col].reduce((a,x)=>Math.max(a,parseInt(String(x.num||'').split('-')[1])||0),0);return pre+'-'+String(m+1).padStart(4,'0')}
async function run(fn){try{await fn()}catch(e){console.error(e);toast('Enregistrement impossible : '+(e.message||e.code||'erreur'),true)}}

/* ---------- Interface de base ---------- */
let toastT;function toast(msg,bad){const t=$('#toast');t.textContent=msg;t.className=bad?'bad':'';t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',bad?6000:2800)}
let onSubmit=null;
function openModal({title,body,submit,label='Enregistrer',wide,footer}){
  const f=$('#mform');f.className='dlg'+(wide?' wide':'');onSubmit=submit||null;
  f.innerHTML=`<header><h2>${esc(title)}</h2><button type="button" class="btn sm" data-act="close" aria-label="Fermer">Fermer</button></header><div class="body">${body}</div>
  <footer>${footer||''}${submit?`<button type="button" class="btn" data-act="close">Annuler</button><button type="submit" class="btn pri">${esc(label)}</button>`:''}</footer>`;
  $('#modal').classList.add('open');const first=f.querySelector('.body input,.body select,.body textarea');if(first)first.focus()}
function closeModal(){$('#modal').classList.remove('open');onSubmit=null;ed=null}
$('#mform').addEventListener('submit',e=>{e.preventDefault();if(onSubmit)run(onSubmit)});
let cfn=null;
function confirmBox(msg,label,fn){$('#cmsg').innerHTML=msg;$('#cyes').textContent=label;cfn=fn;$('#confirm').classList.add('open')}
$('#cno').onclick=()=>$('#confirm').classList.remove('open');
$('#cyes').onclick=()=>{$('#confirm').classList.remove('open');if(cfn)run(cfn)};

function formHTML(fields,v={}){return '<div class="grid">'+fields.map(f=>{
  const val=v[f.k]??f.def??'';let c;
  if(f.type==='select')c=`<select id="f_${f.k}">${f.options.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return `<option value="${esc(a)}"${String(a)===String(val)?' selected':''}>${esc(b)}</option>`}).join('')}</select>`;
  else if(f.type==='textarea')c=`<textarea id="f_${f.k}">${esc(val)}</textarea>`;
  else c=`<input id="f_${f.k}" type="${f.type||'text'}"${f.type==='number'?' step="any" min="0" inputmode="decimal"':''}${f.list?` list="${f.list}"`:''} value="${esc(val)}">`;
  return `<label class="fld${f.full||f.type==='textarea'?' full':''}"><span>${esc(f.label)}${f.req?' *':''}</span>${c}</label>`}).join('')+'</div>'}
function readForm(fields){const o={};for(const f of fields){const el=$('#f_'+f.k);let v=el.value.trim();
  if(f.req&&!v){el.focus();throw {message:'le champ « '+f.label+' » est obligatoire'}}
  o[f.k]=f.type==='number'?num(v):v}return o}

/* ---------- Fiches simples ---------- */
const CAT_DEP=['Achats marchandises','Salaires','Loyer','Transport','Électricité & eau','Impôts & taxes','Entretien','Divers'];
const CAT_PROD=['Outillage à main','Outillage électroportatif','Quincaillerie','Mesure & traçage','Consommables','Équipement de protection','Divers'];
const E={

    fields:()=>[{k:'nom',label:'Nom et prénom',req:1},{k:'poste',label:'Poste',def:'Vendeur'},{k:'tel',label:'Téléphone',type:'tel'},{k:'adresse',label:'Adresse'},{k:'salaire',label:'Salaire mensuel',type:'number'},{k:'dateEmbauche',label:'Date d\'embauche',type:'date',def:today()},{k:'statut',label:'Statut',type:'select',options:['Actif','Parti']}],
    extra:r=>`<button class="btn sm" data-act="paySal" data-id="${r.id}">Payer le salaire</button><button class="btn sm" data-act="newContrat" data-id="${r.id}">Contrat</button>`},
  depenses:{titre:'Dépenses',un:'une dépense',nouveau:'Nouvelle dépense',tri:'-date',cols:[['date','Date','d'],['categorie','Catégorie'],['description','Description'],['beneficiaire','Bénéficiaire'],['montant','Montant','m']],

};
function cell(r,[k,,t]){const v=r[k];
  if(t==='m')return `<td class="r">${grp(v)}</td>`;if(t==='d')return `<td>${fdate(v)}</td>`;
  if(t==='stock'){const low=num(v)<=num(r.seuil);return `<td class="r"><span class="pill ${num(v)<=0?'crit':low?'warn':'ok'}">${grp(v)}</span></td>`}
  if(t==='emp')return `<td><span class="pill ${v==='Parti'?'warn':'ok'}">${esc(v||'Actif')}</span></td>`;
  return `<td>${esc(v)}</td>`}
function sorted(rows,tri){const desc=tri[0]==='-',k=desc?tri.slice(1):tri;return [...rows].sort((a,b)=>{const c=String(a[k]??'').localeCompare(String(b[k]??''),'fr',{numeric:true});return desc?-c||String(b.num||'').localeCompare(String(a.num||'')):c})}
function match(r){if(!S.q)return true;return JSON.stringify(Object.values(r)).toLowerCase().includes(S.q.toLowerCase())}
function tableView(col){const d=E[col];const rows=sorted(state[col].filter(match),d.tri);
  if(!state[col].length)return `<div class="panel"><div class="empty">Aucune fiche pour l'instant.<br><button class="btn pri" data-act="edit" data-col="${col}">${d.nouveau}</button>${col==='produits'?' <button class="btn" data-act="exemples">Ajouter 10 articles d\'exemple</button>':''}</div></div>`;
  let sum='';if(col==='depenses')sum=`<p class="sub">Total affiché : <b>${money(rows.reduce((a,r)=>a+num(r.montant),0))}</b></p>`;
  if(col==='produits')sum=`<p class="sub">Valeur du stock au prix d'achat : <b>${money(state.produits.reduce((a,p)=>a+num(p.stock)*num(p.prixAchat),0))}</b></p>`;
  return sum+`<div class="panel scroll"><table><thead><tr>${d.cols.map(c=>`<th${c[2]==='m'||c[2]==='stock'?' class="r"':''}>${c[1]}${c[2]==='m'?' ('+esc(cfg().devise)+')':''}</th>`).join('')}<th></th></tr></thead><tbody>
  ${rows.map(r=>`<tr>${d.cols.map(c=>cell(r,c)).join('')}<td class="act">${d.extra?d.extra(r):''}<button class="btn sm" data-act="edit" data-col="${col}" data-id="${r.id}">Modifier</button><button class="btn sm danger" data-act="del" data-col="${col}" data-id="${r.id}">Supprimer</button></td></tr>`).join('')||`<tr><td colspan="9" class="empty">Aucun résultat pour cette recherche.</td></tr>`}
  </tbody></table></div>`}
function editEntity(col,id,pre){const d=E[col],fields=d.fields(),cur=id?byId(col,id):pre||{};
  openModal({title:id?'Modifier':d.nouveau,body:formHTML(fields,cur),submit:async()=>{const v=readForm(fields);await store.save(col,id||null,{...strip(cur),...v});closeModal();toast('Enregistré')}})}

/* ---------- Éditeur de documents à lignes (vente, commande, livraison) ---------- */
let ed=null;
const lineTotal=l=>num(l.qte)*num(l.prix);
const edSous=()=>ed.lignes.reduce((a,l)=>a+lineTotal(l),0);
function openEditor(kind,pre={}){
  ed={kind,payeAuto:true,lignes:[{produitId:'',nom:'',qte:1,prix:0}],...pre};
  let head='',tail='',title='',label='Enregistrer';
  if(kind==='facture'){title='Nouvelle vente';label='Valider la vente';
    head=formHTML([{k:'date',label:'Date',type:'date',def:today()},{k:'client',label:'Client (laisser vide pour une vente au comptoir)',list:'dl-clients'}])+`<datalist id="dl-clients">${state.clients.map(c=>`<option value="${esc(c.nom)}">`).join('')}</datalist>`;
    tail=formHTML([{k:'remise',label:'Remise',type:'number',def:0},{k:'paye',label:'Montant payé maintenant',type:'number',def:0},{k:'mode',label:'Mode de paiement',type:'select',options:['Espèces','Mobile Money','Virement','Chèque','Crédit']}])+
      `<label class="chk"><input type="checkbox" id="f_bl"> Créer aussi un bon de livraison</label>`}
  if(kind==='commande'){title='Nouveau bon de commande';
    head=formHTML([{k:'date',label:'Date',type:'date',def:today()},{k:'fournisseurId',label:'Fournisseur',type:'select',req:1,options:[['','Choisir…'],...state.fournisseurs.map(f=>[f.id,f.nom])]}],pre);
    tail=formHTML([{k:'note',label:'Conditions, délai de livraison',type:'textarea'}])}
  if(kind==='livraison'){title='Nouveau bon de livraison';
    head=formHTML([{k:'date',label:'Date',type:'date',def:today()},{k:'clientNom',label:'Livré à',req:1,list:'dl-clients'},{k:'adresse',label:'Adresse de livraison'},{k:'livreur',label:'Livreur'}],pre)+`<datalist id="dl-clients">${state.clients.map(c=>`<option value="${esc(c.nom)}">`).join('')}</datalist>`}
  openModal({title,wide:true,label,submit:saveEditor,body:head+`<div class="scroll"><table id="ed-lines"></table></div><div><button type="button" class="btn ghost sm" data-act="edAdd">+ Ajouter une ligne</button></div><div class="tot" id="ed-tot"></div>`+tail});
  edLines()}
function edLines(){const priced=ed.kind!=='livraison';
  $('#ed-lines').innerHTML=`<thead><tr><th>Article</th><th class="r">Quantité</th>${priced?'<th class="r">Prix unitaire</th><th class="r">Montant</th>':''}<th></th></tr></thead><tbody>`+
  ed.lignes.map((l,i)=>{const known=state.produits.some(p=>p.id===l.produitId);
    return `<tr><td><select data-i="${i}" data-edf="produitId" aria-label="Article"><option value="">Choisir un article…</option>${!known&&l.nom?`<option value="${esc(l.produitId)}" selected>${esc(l.nom)}</option>`:''}${sorted(state.produits,'nom').map(p=>`<option value="${p.id}"${p.id===l.produitId?' selected':''}>${esc(p.nom)}${ed.kind==='facture'?' — stock '+grp(p.stock):''}</option>`).join('')}</select></td>
    <td><input type="number" min="0" step="any" data-i="${i}" data-edf="qte" value="${l.qte}" aria-label="Quantité"></td>
    ${priced?`<td><input type="number" min="0" step="any" data-i="${i}" data-edf="prix" value="${l.prix}" aria-label="Prix unitaire"></td><td class="r" id="lt-${i}">${grp(lineTotal(l))}</td>`:''}
    <td><button type="button" class="btn sm danger" data-act="edDel" data-id="${i}" aria-label="Retirer la ligne">Retirer</button></td></tr>`}).join('')+'</tbody>';
  edTot()}
function edTot(){const box=$('#ed-tot');if(!box||ed.kind==='livraison'){if(box)box.innerHTML='';return}
  const sous=edSous();
  if(ed.kind==='commande'){box.innerHTML=`<b>Total</b><b>${money(sous)}</b>`;return}
  const rem=num($('#f_remise').value),total=Math.max(0,sous-rem);
  if(ed.payeAuto)$('#f_paye').value=total;
  const reste=total-num($('#f_paye').value);
  box.innerHTML=`<span>Sous-total</span><span>${money(sous)}</span><b>Total à payer</b><b>${money(total)}</b><span>Reste dû</span><span>${money(Math.max(0,reste))}</span>`}
$('#mform').addEventListener('input',e=>{const t=e.target;if(!ed)return;
  if(t.dataset.edf){const l=ed.lignes[+t.dataset.i];
    if(t.dataset.edf==='produitId'){const p=byId('produits',t.value);l.produitId=t.value;l.nom=p?p.nom:'';l.prix=p?num(ed.kind==='commande'?p.prixAchat:p.prixVente):0;edLines();return}
    l[t.dataset.edf]=num(t.value);const c=$('#lt-'+t.dataset.i);if(c)c.textContent=grp(lineTotal(l));edTot()}
  else if(t.id==='f_paye'){ed.payeAuto=false;edTot()}
  else if(t.id==='f_remise')edTot()});
async function saveEditor(){
  const lignes=ed.lignes.filter(l=>l.nom&&num(l.qte)>0).map(l=>({produitId:l.produitId,nom:l.nom,qte:num(l.qte),prix:num(l.prix)}));
  if(!lignes.length)throw {message:'ajoutez au moins un article avec une quantité'};
  const date=$('#f_date').value||today();
  if(ed.kind==='facture'){
    const need={};lignes.forEach(l=>need[l.produitId]=(need[l.produitId]||0)+l.qte);
    for(const pid in need){const p=byId('produits',pid);if(p&&need[pid]>num(p.stock))throw {message:`stock insuffisant pour « ${p.nom} » (${grp(p.stock)} en stock). Ajustez le stock dans l'inventaire ou réduisez la quantité`}}
    const nom=$('#f_client').value.trim(),cl=state.clients.find(c=>c.nom.toLowerCase()===nom.toLowerCase());
    const sous=lignes.reduce((a,l)=>a+lineTotal(l),0),remise=Math.min(sous,num($('#f_remise').value)),total=sous-remise,paye=Math.min(total,num($('#f_paye').value)),mode=$('#f_mode').value,bl=$('#f_bl').checked;
    const f={num:nextNum('factures','FAC'),date,clientId:cl?cl.id:'',clientNom:nom||'Client comptoir',lignes,remise,total,paye,mode};
    const id=await store.save('factures',null,f);
    for(const pid in need){const p=byId('produits',pid);if(p)await store.save('produits',p.id,{...p,stock:num(p.stock)-need[pid]})}
    if(paye>0)await store.save('recus',null,{num:nextNum('recus','REC'),date,factureId:id,factureNum:f.num,clientNom:f.clientNom,montant:paye,mode,reste:total-paye});
    if(bl)await store.save('livraisons',null,{num:nextNum('livraisons','BL'),date,factureId:id,factureNum:f.num,clientNom:f.clientNom,adresse:cl?cl.adresse||'':'',livreur:'',statut:'À livrer',lignes:lignes.map(l=>({produitId:l.produitId,nom:l.nom,qte:l.qte}))});
    closeModal();toast('Vente enregistrée : '+f.num);preview('factures',id,f);return}
  if(ed.kind==='commande'){const fid=$('#f_fournisseurId').value,fo=byId('fournisseurs',fid);if(!fo)throw {message:'choisissez un fournisseur'};
    const c={num:nextNum('commandes','BC'),date,fournisseurId:fid,fournisseurNom:fo.nom,lignes,total:lignes.reduce((a,l)=>a+lineTotal(l),0),statut:'En attente',note:$('#f_note').value.trim()};
    const id=await store.save('commandes',null,c);closeModal();toast('Bon de commande créé : '+c.num);preview('commandes',id,c);return}
  if(ed.kind==='livraison'){const nom=$('#f_clientNom').value.trim();if(!nom)throw {message:'indiquez à qui la marchandise est livrée'};
    const b={num:nextNum('livraisons','BL'),date,factureId:ed.factureId||'',factureNum:ed.factureNum||'',clientNom:nom,adresse:$('#f_adresse').value.trim(),livreur:$('#f_livreur').value.trim(),statut:'À livrer',lignes:lignes.map(l=>({produitId:l.produitId,nom:l.nom,qte:l.qte}))};
    const id=await store.save('livraisons',null,b);closeModal();toast('Bon de livraison créé : '+b.num);preview('livraisons',id,b)}}

function docView(col){const d=DOCS[col],rows=sorted(state[col].filter(match),'-date');

  </tbody></table></div>`}

function model(col,x){const c=cfg(),lig=(x.lignes||[]);
  const priced={cols:[['Désignation','l'],['Qté','r'],['Prix unitaire','r'],['Montant','r']],rows:lig.map(l=>[l.nom,grp(l.qte),grp(l.prix),grp(lineTotal(l))])};
  if(col==='factures'){const cl=byId('clients',x.clientId)||{},sous=lig.reduce((a,l)=>a+lineTotal(l),0),reste=num(x.total)-num(x.paye);
    return {titre:'FACTURE',num:x.num,date:x.date,partie:['Client',[x.clientNom,cl.tel,cl.adresse]],...priced,
      totals:[['Sous-total',money(sous)],...(num(x.remise)?[['Remise','- '+money(x.remise)]]:[]),['Total',money(x.total),1],['Payé',money(x.paye)],['Reste à payer',money(reste)]],
      notes:['Arrêtée la présente facture à la somme de '+lettres(x.total)+' '+c.deviseNom+'.','Mode de paiement : '+x.mode+'.'],sign:['Le client','Le vendeur']}}
  if(col==='recus')return {titre:'REÇU DE PAIEMENT',num:x.num,date:x.date,kv:[['Reçu de',x.clientNom],['La somme de',money(x.montant)+' ('+lettres(x.montant)+' '+c.deviseNom+')'],['Pour','Règlement de la facture N° '+x.factureNum],['Mode de paiement',x.mode],['Reste dû sur la facture',money(x.reste)]],sign:['Le client','Le caissier']};
  if(col==='commandes'){const f=byId('fournisseurs',x.fournisseurId)||{};
    return {titre:'BON DE COMMANDE',num:x.num,date:x.date,partie:['Fournisseur',[x.fournisseurNom,f.contact,f.tel,f.adresse]],...priced,totals:[['Total',money(x.total),1]],notes:[x.note].filter(Boolean),sign:['Le fournisseur','Le responsable des achats']}}
  if(col==='livraisons')return {titre:'BON DE LIVRAISON',num:x.num,date:x.date,partie:['Livré à',[x.clientNom,x.adresse]],cols:[['Désignation','l'],['Quantité','r'],['Observation','l']],rows:lig.map(l=>[l.nom,grp(l.qte),'']),
    notes:[x.factureNum?'Référence : facture N° '+x.factureNum+'.':'',x.livreur?'Livreur : '+x.livreur+'.':'','Marchandise reçue en bon état et conforme aux quantités indiquées.'].filter(Boolean),sign:['Le livreur','Le client (nom, date et signature)']};
  if(col==='contrats'){const e=byId('employes',x.employeId)||{},cdd=x.type==='CDD';const P=[];
    P.push(['Entre les soussignés',`${c.nom}${c.adresse?', situé à '+c.adresse:''}${c.rccm?', '+c.rccm:''}, ci-après « l'Employeur », d'une part ;\net ${x.employeNom}${e.adresse?', demeurant à '+e.adresse:''}${e.tel?', téléphone '+e.tel:''}, ci-après « l'Employé(e) », d'autre part ;\nil a été convenu ce qui suit.`]);
    P.push(['Article 1 - Engagement',`L'Employeur engage l'Employé(e) en qualité de ${x.poste} à compter du ${fdate(x.debut)}, par contrat ${x.type==='CDI'?'à durée indéterminée (CDI)':cdd?'à durée déterminée (CDD)'+(x.fin?', qui prend fin le '+fdate(x.fin):''):'de stage'+(x.fin?', qui prend fin le '+fdate(x.fin):'')}.`]);
    if(num(x.essai))P.push(['Article 2 - Période d\'essai',`Le contrat débute par une période d'essai de ${x.essai} mois. Pendant cette période, chaque partie peut mettre fin au contrat dans les conditions prévues par la législation du travail en vigueur.`]);
    P.push(['Article 3 - Fonctions',`L'Employé(e) exécute les tâches liées au poste de ${x.poste} qui lui sont confiées par l'Employeur : accueil et conseil des clients, vente et encaissement, rangement et suivi du stock, entretien de la boutique, ainsi que toute tâche connexe à son poste.`]);
    P.push(['Article 4 - Lieu et horaires de travail',`Le travail s'effectue à ${x.lieu||c.adresse||'la boutique'}. Les horaires sont les suivants : ${x.horaires||'selon le planning fixé par l\'Employeur'}, dans le respect de la durée légale du travail.`]);
    P.push(['Article 5 - Rémunération',`L'Employé(e) perçoit un salaire mensuel de ${money(x.salaire)} (${lettres(x.salaire)} ${c.deviseNom}), payé à la fin de chaque mois.`]);

function pdfBlob(m){const {jsPDF}=window.jspdf,d=new jsPDF({unit:'mm',format:'a4'}),c=cfg(),L=15,R=195;let y=18;
  const ensure=h=>{if(y+h>280){d.addPage();y=18}},F=(b,s)=>{d.setFont('helvetica',b?'bold':'normal');d.setFontSize(s)};
  const para=(t,w=R-L,x=L)=>{String(t).split('\n').forEach(pt=>d.splitTextToSize(pt,w).forEach(ln=>{ensure(5);d.text(ln,x,y);y+=4.9}))};
  const lg=logo();let X=L,W=105;if(lg){const hh=18,ww=Math.min(42,hh*lg.w/lg.h),h2=ww*lg.h/lg.w;try{d.addImage(lg.data,lg.data.indexOf('image/png')>0?'PNG':'JPEG',L,11,ww,h2);X=L+ww+4;W=105-ww-4}catch(e){}}
  F(1,16);d.text(d.splitTextToSize(c.nom,W)[0],X,y);F(0,9);let yy=y+5;
  [c.adresse,[c.tel,c.email].filter(Boolean).join('  -  '),c.rccm].filter(Boolean).forEach(t=>{d.text(d.splitTextToSize(t,W)[0],X,yy);yy+=4.2});if(lg)yy=Math.max(yy,31);
  F(1,15);d.setTextColor(200,70,15);d.text(m.titre,R,y,{align:'right'});d.setTextColor(20);
  F(0,10);d.text('N° '+m.num,R,y+6,{align:'right'});d.text('Date : '+fdate(m.date),R,y+11,{align:'right'});
  y=Math.max(yy,y+14)+1;d.setDrawColor(34,48,61);d.setLineWidth(.6);d.line(L,y,R,y);y+=8;
  if(m.partie){F(1,10);d.text(m.partie[0]+' :',L,y);y+=5;F(0,10);m.partie[1].filter(Boolean).forEach(t=>para(t));y+=4}
  if(m.kv){m.kv.forEach(k=>{ensure(9);F(0,10);d.setTextColor(90);d.text(k[0],L,y);d.setTextColor(20);F(1,10.5);para(k[1],R-L-55,L+55);y+=4});y+=2}
  if(m.cols){const n=m.cols.length,ws=m.cols.map((k,i)=>i===0?0:(k[1]==='r'?(n>3?32:30):60));ws[0]=R-L-ws.reduce((a,b)=>a+b,0);
    const xs=[];let x=L;ws.forEach(w=>{xs.push(x);x+=w});
    const tx=(v,i)=>m.cols[i][1]==='r'?d.text(String(v),xs[i]+ws[i]-2,y,{align:'right'}):d.text(String(v),xs[i]+2,y);
    const head=()=>{d.setFillColor(232,236,240);d.rect(L,y-4.5,R-L,7,'F');F(1,9);m.cols.forEach((k,i)=>tx(k[0],i));y+=7;F(0,10)};
    head();d.setLineWidth(.15);d.setDrawColor(200);
    m.rows.forEach(r=>{const lines=d.splitTextToSize(String(r[0]),ws[0]-4),h=lines.length*4.6+3;if(y+h>278){d.addPage();y=20;head()}
      d.text(lines,xs[0]+2,y);r.forEach((v,i)=>{if(i)tx(v,i)});y+=h-3;d.line(L,y-1.2,R,y-1.2);y+=3.4});y+=3}
  if(m.totals){m.totals.forEach(t=>{ensure(7);F(t[2],t[2]?12:10);d.text(t[0],R-78,y);d.text(t[1],R,y,{align:'right'});y+=t[2]?7:5.4});y+=4}
  (m.paras||[]).forEach(p=>{if(p[0]){ensure(12);y+=2;F(1,10.5);d.text(p[0],L,y);y+=5.2}F(0,10.5);para(p[1]);y+=1.5});
  if(m.notes&&m.notes.length){F(0,10);m.notes.forEach(t=>{para(t);y+=1})}
  ensure(42);y+=14;F(1,10);d.text(m.sign[0],L,y);d.text(m.sign[1],R,y,{align:'right'});
  if(m.titre!=='CONTRAT DE TRAVAIL'&&c.pied){F(0,8.5);d.setTextColor(100);d.text(d.splitTextToSize(c.pied,170)[0],105,290,{align:'center'})}
  return d.output('blob')}

function preview(col,id,obj){const x=obj||byId(col,id);if(!x)return;const m=model(col,x);cur={m,name:m.num+'.pdf'};

async function downloadPdf(){if(!cur)return;if(!window.jspdf){toast('Le module PDF n\'a pas pu être chargé. Vérifiez la connexion puis rechargez la page.',true);return}
  const blob=pdfBlob(cur.m);

  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=cur.name;a.click()}catch(e){toast('Le téléchargement n\'est pas disponible dans cet affichage.',true)}}

function dashboard(){const t=today(),mo=t.slice(0,7),F=state.factures;
  const vj=F.filter(f=>f.date===t),vm=F.filter(f=>(f.date||'').startsWith(mo));
  const sum=(a,k)=>a.reduce((s,x)=>s+num(x[k]),0);
  const dep=sum(state.depenses.filter(d=>(d.date||'').startsWith(mo)),'montant'),enc=sum(state.recus.filter(r=>(r.date||'').startsWith(mo)),'montant');
  const du=F.reduce((s,f)=>s+Math.max(0,num(f.total)-num(f.paye)),0);
  const low=sorted(state.produits.filter(p=>num(p.stock)<=num(p.seuil)),'nom');
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return {k,v:sum(F.filter(f=>f.date===k),'total')}});
  const mx=Math.max(1,...days.map(d=>d.v));const short=v=>v>=1e6?(v/1e6).toFixed(1).replace('.0','')+' M':v>=1e3?Math.round(v/1e3)+' k':String(v);

    <div class="tile"><span>Dû par les clients</span><strong>${money(du)}</strong><em>${F.filter(f=>num(f.total)-num(f.paye)>0).length} facture(s) à encaisser</em></div></div>
  <div class="cols">
    <div class="panel"><header><h2>Ventes des 7 derniers jours</h2></header><div class="bars">${days.map(d=>`<div title="${fdate(d.k)} : ${grp(d.v)}">${d.v?short(d.v):''}<u style="height:${Math.round(d.v/mx*78)}%"></u>${d.k.slice(8)}/${d.k.slice(5,7)}</div>`).join('')}</div></div>
    <div class="panel"><header><h2>Stock à réapprovisionner</h2><span class="pill ${low.length?'crit':'ok'}">${low.length}</span></header>${low.length?`<div class="scroll"><table><tbody>${low.slice(0,8).map(p=>`<tr><td>${esc(p.nom)}</td><td class="r"><span class="pill ${num(p.stock)<=0?'crit':'warn'}">${grp(p.stock)}</span></td><td class="r sub">seuil ${grp(p.seuil)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Aucun article sous son seuil d'alerte.</div>`}</div>
  </div>
  <div class="panel"><header><h2>Dernières ventes</h2><a href="#ventes">Tout voir</a></header>${F.length?`<div class="scroll"><table><tbody>${sorted(F,'-date').slice(0,6).map(f=>{const r=num(f.total)-num(f.paye);return `<tr><td>${esc(f.num)}</td><td>${fdate(f.date)}</td><td>${esc(f.clientNom)}</td><td class="r">${money(f.total)}</td><td><span class="pill ${r<=0?'ok':num(f.paye)>0?'warn':'crit'}">${r<=0?'Payée':num(f.paye)>0?'Partielle':'Impayée'}</span></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty">Aucune vente enregistrée.</div>`}</div>`}

  delDoc:(id,b)=>{const col=b.dataset.col,x=byId(col,id);
    if(col==='factures')return confirmBox(`Annuler la facture <b>${esc(x.num)}</b> ? Les articles reviennent en stock et les reçus liés sont supprimés.`,'Annuler la facture',async()=>{
      const back={};x.lignes.forEach(l=>back[l.produitId]=(back[l.produitId]||0)+num(l.qte));
      for(const pid in back){const p=byId('produits',pid);if(p)await store.save('produits',p.id,{...p,stock:num(p.stock)+back[pid]})}
      for(const r of state.recus.filter(r=>r.factureId===id))await store.remove('recus',r.id);await store.remove('factures',id);toast('Facture annulée')});
    confirmBox(`Supprimer définitivement <b>${esc(x.num)}</b> ?`,'Supprimer',async()=>{await store.remove(col,id);toast('Supprimé')})},
  paySal:id=>{const e=byId('employes',id),mois=new Date().toLocaleDateString('fr-FR',{month:'long',year:'numeric'});editEntity('depenses',null,{date:today(),categorie:'Salaires',montant:e.salaire,beneficiaire:e.nom,description:'Salaire '+mois})},
  newContrat:id=>{if(!state.employes.length){toast('Ajoutez d\'abord un employé.',true);location.hash='employes';return}
    const e=byId('employes',id)||state.employes[0];
    const fl=[{k:'employeId',label:'Employé',type:'select',options:state.employes.map(x=>[x.id,x.nom])},{k:'type',label:'Type de contrat',type:'select',options:['CDI','CDD','Stage']},{k:'poste',label:'Poste',req:1},{k:'salaire',label:'Salaire mensuel',type:'number',req:1},{k:'debut',label:'Date de début',type:'date',req:1},{k:'fin',label:'Date de fin (CDD ou stage)',type:'date'},{k:'essai',label:'Période d\'essai (mois)',type:'number',def:1},{k:'horaires',label:'Horaires',def:'du lundi au samedi, de 8 h à 18 h'},{k:'lieu',label:'Lieu de travail'},{k:'clauses',label:'Clauses particulières',type:'textarea'}];
    openModal({title:'Nouveau contrat de travail',wide:true,label:'Créer le contrat',body:formHTML(fl,{employeId:e.id,poste:e.poste,salaire:e.salaire,debut:e.dateEmbauche||today()}),submit:async()=>{const v=readForm(fl),em=byId('employes',v.employeId);
      if(v.type!=='CDI'&&!v.fin)throw {message:'indiquez la date de fin pour un CDD ou un stage'};
      const c={...v,num:nextNum('contrats','CT'),date:today(),employeNom:em.nom};const cid=await store.save('contrats',null,c);closeModal();toast('Contrat créé : '+c.num);preview('contrats',cid,c)}});
    $('#f_employeId').onchange=ev=>{const x=byId('employes',ev.target.value);$('#f_poste').value=x.poste||'';$('#f_salaire').value=x.salaire||0}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=A[b.dataset.act];if(f)f(b.dataset.id,b)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#confirm').classList.contains('open'))$('#confirm').classList.remove('open');else closeModal()}});

document.addEventListener('change',e=>{const t=e.target;if(t.id!=='logoFile'||!t.files[0])return;const file=t.files[0];
  if(!/^image\//.test(file.type)){toast('Choisissez un fichier image (PNG ou JPG).',true);return}
  const rd=new FileReader();rd.onerror=()=>toast('Lecture du fichier impossible.',true);
  rd.onload=()=>{const im=new Image();im.onerror=()=>toast('Cette image ne peut pas être lue.',true);
    im.onload=()=>run(async()=>{const k=Math.min(1,400/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),hh=Math.max(1,Math.round(im.height*k));
      const cv=document.createElement('canvas');cv.width=w;cv.height=hh;const cx=cv.getContext('2d');cx.drawImage(im,0,0,w,hh);let data=cv.toDataURL('image/png');
      if(data.length>220000){cx.fillStyle='#fff';cx.fillRect(0,0,w,hh);cx.drawImage(im,0,0,w,hh);data=cv.toDataURL('image/jpeg',.85)}
      await store.save('config','logo',{data,w,h:hh});toast('Logo enregistré')});
    im.src=rd.result};rd.readAsDataURL(file)});

/* ---------- Démarrage ---------- */
(async function init(){
  route();let db=null;
  try{if(window.claude&&window.claude.use)db=await window.claude.use('db')}catch(e){}
  if(db){S.db=db;const t=setTimeout(()=>{if(!S.ready){S.ready=true;refresh()}setStatus('late')},10000);let pending=COLS.length;const seen={};
    COLS.forEach(c=>db.collection(c).onSnapshot(s=>{state[c]=s.docs.map(d=>({id:d.id,...d.data()}));
      if(!seen[c]){seen[c]=1;pending--}
      if(pending<=0)S.ready=true;
      if(!s.metadata.fromCache&&pending<=0){clearTimeout(t);setStatus('ok')}
      refresh()},()=>{clearTimeout(t);S.ready=true;setStatus('err');refresh()}))}
  else{loadLocal();S.ready=true;setStatus('local');refresh()}
  try{if(window.claude&&window.claude.use)S.dl=await window.claude.use('downloads')}catch(e){}
})();
</script>
